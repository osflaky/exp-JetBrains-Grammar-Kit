# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Create a draft release.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: true

jobs:

  # Prepare the environment and build the plugin
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Build [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:

      # Free GitHub Actions Environment Disk Space (the action only supports Linux runners: it relies on sudo/apt-get/free)
    - name: Maximize Build Space
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        large-packages: false

      # Check out the current repository
    - name: Fetch Sources
      uses: actions/checkout@v6

      # Set up the Java environment for the next steps
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 17

      # Setup Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

      # Build plugin
    - name: Build plugin
      run: ./gradlew buildPlugin

      # Prepare plugin archive content for creating artifact
    - name: Prepare Plugin Artifact
      id: artifact
      shell: bash
      run: |
        # Relative path: an unquoted Windows workspace path (D:\a\...) loses its backslashes in bash
        cd build/distributions
        FILENAME=`ls *.zip`
        unzip "$FILENAME" -d content

        # Suffix removal instead of ${FILENAME:0:-4}: macOS ships bash 3.2, which rejects negative substring lengths
        echo "filename=${FILENAME%.zip}" >> $GITHUB_OUTPUT

      # Store an already-built plugin as an artifact for downloading
    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.artifact.outputs.filename }}-${{ matrix.os }}-${{ 
          matrix.arch }}
        path: ./build/distributions/content/*/*

  # Run tests and upload a code coverage report
    timeout-minutes: 150
